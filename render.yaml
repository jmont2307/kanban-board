services:
  # PostgreSQL Database Service
  - type: pserv
    name: kanban-db
    plan: free
    env: postgres
    database: kanban_db
    user: postgres

  # Web application
  - type: web
    name: kanban-app
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DB_URL
        fromService:
          type: pserv
          name: kanban-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production